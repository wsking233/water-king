name: Check and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:lifecycle
      - run: git diff --exit-code -- supabase/lifecycle-upgrade.sql
      - name: Mobile sync and offline regression
        run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Mobile email account regression
        run: npm run test:email-browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run build -- --base=/water-king/
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CLOUD_SYNC_PREVIEW: ${{ vars.VITE_CLOUD_SYNC_PREVIEW }}
          VITE_EMAIL_AUTH_PREVIEW: ${{ vars.VITE_EMAIL_AUTH_PREVIEW }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
