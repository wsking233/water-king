services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: waterking
      POSTGRES_PASSWORD: localdevelopment
      POSTGRES_DB: waterking
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
volumes:
  postgres-data:
